name: portable-typesetting
on:
  push:
    branches: [main]
    paths: ['.gitattributes', 'templates/**', 'scripts/paper_template.py', 'scripts/pdf_text.py', 'scripts/check_pdf.py', 'scripts/freeze_pdf.py', 'demos/mcm-2016-a/reproduce/build_report.py', 'research/merge-after-toll/paper/paper.tex', 'demos/domino-research/reproduce/build_note.py', 'demos/collatz-research/reproduce/paper/**', 'scripts/contest_rules.py', 'demos/cumcm-1998-a/deliverables/**', '.github/scripts/typesetting.py', '.github/workflows/typesetting.yml']
  pull_request:
    paths: ['.gitattributes', 'templates/**', 'scripts/paper_template.py', 'scripts/pdf_text.py', 'scripts/check_pdf.py', 'scripts/freeze_pdf.py', 'demos/mcm-2016-a/reproduce/build_report.py', 'research/merge-after-toll/paper/paper.tex', 'demos/domino-research/reproduce/build_note.py', 'demos/collatz-research/reproduce/paper/**', 'scripts/contest_rules.py', 'demos/cumcm-1998-a/deliverables/**', '.github/scripts/typesetting.py', '.github/workflows/typesetting.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typeset:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked python .github/scripts/typesetting.py
        # Run with the repository on the module search path on every host.
        env:
          PYTHONPATH: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typesetting-${{ matrix.os }}
          path: |
            .session/typesetting/*.pdf
            .session/typesetting/*.json
            .session/typesetting/*.txt
            .session/typesetting/*.log
          include-hidden-files: true

  compare:
    needs: typeset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: typesetting-*
          path: .session/platform-artifacts
      - run: uv run --locked python .github/scripts/typesetting.py --compare .session/platform-artifacts
        env:
          PYTHONPATH: .
      - uses: actions/upload-artifact@v4
        with:
          name: cross-platform-verification
          path: .session/platform-artifacts/cross-platform-verification.json
          include-hidden-files: true
