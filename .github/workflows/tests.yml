name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked python -m pytest -q

  runtime-contract:
    name: runtime-contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Prepare the locked Python environment
        run: uv sync --locked
      - name: Run numerical pipeline and MCP contract
        run: uv run --locked --no-sync python .github/scripts/runtime_contract.py --bundle . --work ".session/Runtime contract with spaces" --receipt .session/runtime-contract.json
      - name: Check transport limits and worker deadlines
        run: uv run --locked --no-sync python -m pytest -q tests/test_mcp_request_limits.py tests/test_bounded_execution.py tests/test_asof_join.py tests/test_mcp_asof.py tests/test_data_vintages_demo.py tests/test_mcm_identity.py tests/test_figure_titles.py tests/test_plugin_math_audit.py tests/test_feedback_compression.py tests/test_reference_doi_boundaries.py tests/test_plugin_export_receipt.py tests/test_paper_dependencies.py tests/test_runtime_info.py tests/test_utf8_boundaries.py --basetemp=.session/runtime-focused-pytest --junitxml=.session/runtime-focused.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-contract-${{ matrix.os }}
          path: |
            .session/runtime-contract*.json
            .session/runtime-focused.xml
            .session/Runtime contract with spaces/**
          include-hidden-files: true
