[project]
name = "praxis"
version = "0.2.0"
description = "An agent plugin for evidence-based mathematical modeling: skills and math tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "networkx>=3.3,<4",
  "sympy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "salib>=1.5,<2",
  "pymcdm>=1.3,<2",
  "pypdfium2>=4,<6",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.session/pytest"
